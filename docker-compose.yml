services:
  postgres:
    image: postgres:16-alpine
    container_name: digishop-postgres
    restart: unless-stopped
    ports:
      # Host 5433–5532 often blocked by Windows Hyper-V reserved ranges; use 15432 instead.
      - '15432:5432'
    environment:
      POSTGRES_USER: digishop
      POSTGRES_PASSWORD: digishop
      POSTGRES_DB: digishop
    volumes:
      - digishop_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digishop -d digishop']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: digishop-api
    restart: unless-stopped
    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: development
      APP_URL: http://localhost:3333
      FRONTEND_URL: http://localhost:4000
      ADMIN_URL: http://localhost:4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: digishop
      DB_PASSWORD: digishop
      DB_DATABASE: digishop
      ZARINPAL_CALLBACK_URL: http://localhost:3333/api/v1/payments/zarinpal/callback
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000000
    volumes:
      - ./app:/app/app
      - ./start:/app/start
      - ./config:/app/config
      - ./database:/app/database
      - ./providers:/app/providers
      - ./adonisrc.ts:/app/adonisrc.ts
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  digishop_pg_data:
