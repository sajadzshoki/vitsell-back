services:
  postgres:
    image: postgres:16-alpine
    container_name: vitsell-postgres
    restart: unless-stopped
    ports:
      # Host 5433–5532 often blocked by Windows Hyper-V reserved ranges; use 15432 instead.
      - '15432:5432'
    environment:
      POSTGRES_USER: vitsell
      POSTGRES_PASSWORD: vitsell
      POSTGRES_DB: vitsell
    volumes:
      - vitsell_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vitsell -d vitsell']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO CE images moved off Docker Hub; use Quay (last published CE) or override.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vitsell-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-vitsell}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-vitsellsecret}
    volumes:
      - vitsell_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: vitsell-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-vitsell}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-vitsellsecret}
      S3_BUCKET: ${S3_BUCKET:-vitsell}
    volumes:
      - ./docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/minio-init.sh']
    restart: 'no'

  api:
    build: .
    container_name: vitsell-api
    restart: unless-stopped
    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: development
      APP_URL: http://localhost:3333
      FRONTEND_URL: http://localhost:4000
      ADMIN_URL: http://localhost:4001
      APP_VERSION: ${APP_VERSION:-beta.0.1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: vitsell
      DB_PASSWORD: vitsell
      DB_DATABASE: vitsell
      # Local Docker: seed sample data + OTP/payment mock when provider keys are empty
      RUN_DB_SEED: "true"
      ALLOW_OTP_MOCK: "true"
      ALLOW_PAYMENT_MOCK: "true"
      ZARINPAL_CALLBACK_URL: http://localhost:3333/api/v1/payments/zarinpal/callback
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000000
      DRIVE_DISK: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-vitsell}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-vitsellsecret}
      AWS_REGION: ${AWS_REGION:-ir-thr-1}
      S3_BUCKET: ${S3_BUCKET:-vitsell}
      # Inside compose network talk to MinIO by service name
      S3_ENDPOINT: http://minio:9000
      # Browser hits host-mapped MinIO
      S3_PUBLIC_URL: http://127.0.0.1:9000/vitsell
    volumes:
      - ./app:/app/app
      - ./start:/app/start
      - ./config:/app/config
      - ./database:/app/database
      - ./commands:/app/commands
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh
      - ./providers:/app/providers
      - ./adonisrc.ts:/app/adonisrc.ts
      - ./storage:/app/storage
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3333/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  vitsell_pg_data:
  vitsell_minio_data:
