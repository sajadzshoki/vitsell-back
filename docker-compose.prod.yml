# Production compose - URLs come only from `.env` (do not override here).
#
# Required production domains in `.env`:
#   NODE_ENV=production
#   APP_URL=https://api.vitsell.ir
#   FRONTEND_URL=https://vitsell.ir
#   ADMIN_URL=https://admin.vitsell.ir
#
# MinIO / Drive (also in `.env`):
#   DRIVE_DISK=s3
#   AWS_ACCESS_KEY_ID=...
#   AWS_SECRET_ACCESS_KEY=...
#   S3_BUCKET=vitsell
#   S3_ENDPOINT=http://minio:9000
#   S3_PUBLIC_URL=https://cdn.vitsell.ir/vitsell   # or http://minio-host:9000/vitsell
#
# After editing `.env`, recreate (restart is not enough):
#   docker compose -f docker-compose.prod.yml up -d --force-recreate api
# Verify:
#   docker exec digishop-api printenv ADMIN_URL NODE_ENV FRONTEND_URL APP_URL
# Expect:
#   ADMIN_URL=https://admin.vitsell.ir

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      # Host 5433–5532 often blocked by Windows Hyper-V reserved ranges; use 15432 instead.
      - '15432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-vitsell}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vitsell}
      POSTGRES_DB: ${DB_DATABASE:-vitsell}
    volumes:
      - vitsell_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-vitsell}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-vitsellsecret}
    volumes:
      - vitsell_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-vitsell}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-vitsellsecret}
      S3_BUCKET: ${S3_BUCKET:-vitsell}
    volumes:
      - ./docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/minio-init.sh']
    restart: 'no'

  api:
    build: .
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose network DB / MinIO only - public URLs come from `.env`
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vitsell}
      DB_PASSWORD: ${DB_PASSWORD:-vitsell}
      DB_DATABASE: ${DB_DATABASE:-vitsell}
      RUN_DB_SEED: "false"
      DRIVE_DISK: ${DRIVE_DISK:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-vitsell}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  vitsell_pg_data:
  vitsell_minio_data:


networks:
  default:
    external: true
    name: main
